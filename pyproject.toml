[project]
name = "vae-demo"
version = "0.1.0"
description = "2-D latent beta-VAE on MNIST with an interactive latent pad"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "numpy",
    "matplotlib",
    "anywidget>=0.9",
    "ipykernel",
    "jupyterlab",
    "nbconvert",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vae_demo"]

# CUDA wheels on Windows/Linux; macOS falls back to the default PyPI wheels.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
